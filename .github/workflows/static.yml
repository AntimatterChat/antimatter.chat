# Deploys the site to GitHub Pages: the pages as committed, plus the interactive demo (demo/), which is assembled at
# each deployment by tools/demo/build_demo.py from the published antimatter-next image (the Fusion web app and the
# default apps, as built from the repositories' main branches) and the fixtures committed in src/demo/fixtures.
#
# Besides pushes to main, it runs every three hours and deploys again when that image changed: the image is built
# each night and whenever a repository's main branch asks for it (see antimatter-docker's README), so the demo
# follows Fusion's changes without anything being committed here. A repository_dispatch event of type
# demo-update deploys at once.
name: Deploy static content to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:
  schedule:
    - cron: "40 */3 * * *"
  repository_dispatch:
    types: [demo-update]

permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

env:
  DEMO_IMAGE: ghcr.io/antimatterchat/antimatter-next
  DEMO_TAG: latest

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Check the demo's fixtures and mock server
        run: |
          python3 tools/demo/test_fixtures.py
          node tools/demo/smoke_mock.js

      - name: Find the app image
        id: image
        run: |
          set -euo pipefail
          digest="$(python3 tools/demo/build_demo.py --digest "${DEMO_IMAGE}:${DEMO_TAG}")"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"
          # A scheduled run deploys only when the image changed since the demo that is online.
          live="$(curl -fsSL https://antimatter.chat/demo/build.json \
            | python3 -c 'import json, sys; print(json.load(sys.stdin)["source"].get("digest", ""))' || true)"
          if [ "$GITHUB_EVENT_NAME" = "schedule" ] && [ "$live" = "$digest" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "The demo online already runs ${DEMO_IMAGE}@${digest}: nothing to deploy." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Cache the image's web files
        if: steps.image.outputs.skip != 'true'
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/.cache/antimatter-demo
          key: demo-image-${{ steps.image.outputs.digest }}

      - name: Build the demo
        if: steps.image.outputs.skip != 'true'
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          set -euo pipefail
          python3 tools/demo/build_demo.py --image "${DEMO_IMAGE}@${DIGEST}"
          {
            echo "Demo built from ${DEMO_IMAGE}@${DIGEST}:"
            echo '```json'
            cat demo/build.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Setup Pages
        if: steps.image.outputs.skip != 'true'
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0

      - name: Upload artifact
        if: steps.image.outputs.skip != 'true'
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          # Upload entire repository, with the demo just built
          path: '.'

      - name: Deploy to GitHub Pages
        if: steps.image.outputs.skip != 'true'
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
