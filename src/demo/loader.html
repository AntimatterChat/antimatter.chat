<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Antimatter demo</title>
<meta name="description" content="Try Antimatter in your browser: the real app with the Lumen Labs sample data. Nothing you do is saved.">
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="{{base}}mock/banner.css?v={{version}}">
<script src="{{base}}mock/loader.js?v={{version}}" id="demo-loader" data-base="{{base}}" data-version="{{version}}" data-mode="{{mode}}" defer></script>
</head>
<body class="demo-loader">
<main>
  <img src="/assets/img/logo.svg" alt="" width="64" height="64">
  <h1>Antimatter</h1>
  <p class="demo-loader-status" data-i18n="loading">Starting the demo…</p>
  <p class="demo-loader-note" data-i18n="banner">Demo with sample data. Nothing you do here is saved.</p>
  <p><a href="/" data-i18n="back">Back to the website</a></p>
  <noscript><p>The demo needs JavaScript.</p></noscript>
</main>
</body>
</html>
