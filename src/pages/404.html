title: Page not found
description: This page doesn't exist.
plain: yes
---
<div class="page-head"><div class="wrap"><span class="eyebrow">404</span><h1>This page doesn't exist</h1>
<p>It may have moved. <a href="/">Back to the home page</a>, or see the <a href="/features.html">features</a>.</p></div></div>
<script>
// The demo's own routes (/demo/lumen/channels/...) are answered by its service worker. Before it is installed (a
// first visit through a shared link), they get this page: go through the demo's loader, which installs it and opens
// the same route. (A script of its own: relative links in this page don't resolve under nested paths.)
if (/^\/demo\/./.test(location.pathname)) {
    location.replace('/demo/?path=' + encodeURIComponent(location.pathname.slice(6) + location.search));
}
</script>
